services:
  postgres:
    image: postgres:17-alpine
    container_name: observabilidad-postgres
    environment:
      POSTGRES_USER: observabilidad
      POSTGRES_PASSWORD: observabilidad
      POSTGRES_DB: observabilidad
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U observabilidad -d observabilidad"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend-poc
    container_name: observabilidad-api
    environment:
      DATABASE_URL: postgresql+psycopg://observabilidad:observabilidad@postgres:5432/observabilidad
      OTEL_SERVICE_NAME: api-visitas
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=poc,service.namespace=observabilidad
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: otlp
      OTEL_TRACES_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_PYTHON_LOG_CORRELATION: "true"
      OTEL_METRICS_EXPORT_INTERVAL: 5000
      OTEL_SEMCONV_STABILITY_OPT_IN: http
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-poc
    container_name: observabilidad-frontend
    ports:
      - "4200:80"
    depends_on:
      - api

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    container_name: observabilidad-otel-collector
    user: "0:0"
    volumes:
      - ./observabilidad/collector/config.yaml:/etc/otelcol-contrib/config.yaml
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8889:8889" # exporter de Prometheus
  
  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: observabilidad-prometheus
    volumes:
      - ./observabilidad/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
    restart: unless-stopped
    
  loki:
    image: grafana/loki:3.7.9
    container_name: observabilidad-loki
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./observabilidad/loki/config.yaml:/etc/loki/config.yaml
      - loki_data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:2.20.0
    container_name: observabilidad-jaeger
    ports:
      - "16686:16686"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.0
    container_name: observabilidad-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observabilidad/grafana/provisioning:/etc/grafana/provisioning
      - ./observabilidad/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    ports:
    - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - jaeger
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  loki_data:
  grafana_data:
